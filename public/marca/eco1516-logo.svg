<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" role="img" aria-labelledby="eco-logo-titulo">
  <title id="eco-logo-titulo">Ecuador Casa de Oración</title>
  <!-- Dos manos abiertas que forman el techo de una casa, con la llama en
       el centro. Mismo gesto que el logotipo original, redibujado como
       vectores planos para que pese poco y escale bien. -->
  <g fill="none" stroke="#7B57A6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- techo -->
    <path d="M38 62 L60 40 L82 62" stroke-width="6.5" />
    <!-- mano izquierda -->
    <path d="M22 76 V50" />
    <path d="M30 76 V42" />
    <path d="M14 78 V58" />
    <path d="M14 76 q2 18 18 22" />
    <!-- mano derecha -->
    <path d="M98 76 V50" />
    <path d="M90 76 V42" />
    <path d="M106 78 V58" />
    <path d="M106 76 q-2 18 -18 22" />
    <!-- suelo -->
    <path d="M10 104 q50 -9 100 0" stroke-width="4" />
  </g>
  <!-- llama -->
  <path d="M60 52 c7 9 13 15 13 24 a13 13 0 0 1 -26 0 c0 -7 4 -11 7 -15 c1 4 3 6 5 7 c-2 -6 -1 -12 1 -16 z" fill="#2DB6DC" />
</svg>
